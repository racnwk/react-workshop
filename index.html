<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

// ===========================
// 自前のハッシュルーター
// ===========================
const ROUTES = ["/", "/how", "/try", "/fin", "/setup"];

function useHashRoute() {
  const getPath = () => {
    const h = window.location.hash || "#/";
    return h.slice(1) || "/";
  };
  const [path, setPath] = useState(getPath());
  useEffect(() => {
    const onChange = () => setPath(getPath());
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  const navigate = useCallback((to) => {
    window.location.hash = "#" + to;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);
  return [path, navigate];
}

function NavLink({ to, children, className, activeClass, navigate, current }) {
  const isActive = current === to || (to === "/" && current === "/");
  return (
    <a
      href={"#" + to}
      onClick={e => { e.preventDefault(); navigate(to); }}
      className={(className || "") + " " + (isActive ? activeClass || "" : "")}
    >
      {children}
    </a>
  );
}

// ===========================
// アイコン
// ===========================
const Icon = ({ children, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const HomeIcon = () => <Icon><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
const HeartIcon = () => <Icon><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></Icon>;
const StarIcon = () => <Icon><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>;
const CookieIcon = () => <Icon><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/><path d="M11 17v.01"/><path d="M7 14v.01"/></Icon>;
const SparkleIcon = () => <Icon><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></Icon>;
const FlagIcon = () => <Icon><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></Icon>;
const ArrowR = () => <Icon><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>;
const ArrowL = () => <Icon><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Icon>;
const Copy = () => <Icon><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;
const Check = () => <Icon><polyline points="20 6 9 17 4 12"/></Icon>;
const Reload = () => <Icon><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></Icon>;

// ===========================
// Sandbox
// ===========================
function compileUserCode(code, customConsole, prelude) {
  const stripped = code
    .replace(/^\s*import[\s\S]*?from\s+["'][^"']+["'];?\s*$/gm, "")
    .replace(/^\s*export\s+default\s+/gm, "");
  const componentNameMatch = stripped.match(/function\s+([A-Z]\w*)/);
  const compName = componentNameMatch ? componentNameMatch[1] : "App";
  const preludeStr = prelude ? (prelude + "\n") : "";
  const wrapped = "(function(React, console){\nconst { useState, useEffect, useRef } = React;\n" + preludeStr + stripped + "\nreturn " + compName + ";\n})";
  const transformed = Babel.transform(wrapped, { presets: ["react"] }).code;
  const factory = (0, eval)(transformed);
  return factory(React, customConsole || console);
}

function fmtConsoleArg(arg, depth) {
  if (depth === undefined) depth = 2;
  if (arg === null) return "null";
  if (arg === undefined) return "undefined";
  if (typeof arg === "string") return arg;
  if (typeof arg === "number" || typeof arg === "boolean") return String(arg);
  if (typeof arg === "function") return "[Function]";
  if (depth < 0) return "...";
  if (Array.isArray(arg)) return "[" + arg.map(x => fmtConsoleArg(x, depth - 1)).join(", ") + "]";
  if (arg && typeof arg === "object" && arg.$$typeof) {
    const type = typeof arg.type === "string" ? '"' + arg.type + '"' : ((arg.type && arg.type.name) || "Component");
    const props = arg.props ? fmtConsoleArg(arg.props, depth - 1) : "{}";
    return "{ type: " + type + ", props: " + props + " }";
  }
  if (typeof arg === "object") {
    const keys = Object.keys(arg).filter(k => !k.startsWith("_") && k !== "$$typeof");
    if (keys.length === 0) return "{}";
    const items = keys.slice(0, 6).map(k => k + ": " + fmtConsoleArg(arg[k], depth - 1));
    return "{ " + items.join(", ") + (keys.length > 6 ? ", ..." : "") + " }";
  }
  return String(arg);
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) return <div className="text-xs text-rose-700 bg-orange-50 border-2 border-orange-200 rounded-2xl p-3 code-font">⚠ {String(this.state.err.message || this.state.err)}</div>;
    return this.props.children;
  }
}

function Sandbox({ initialCode, height = 280, prelude }) {
  const [code, setCode] = useState(initialCode);
  const [error, setError] = useState(null);
  const [Component, setComponent] = useState(() => () => null);
  const [renderKey, setRenderKey] = useState(0);
  const [logs, setLogs] = useState([]);
  const logsRef = useRef([]);
  const flushScheduledRef = useRef(false);

  const MAX_LOGS = 200;

  const pushLog = (type, args) => {
    // MAX_LOGS を超えたら古いものから捨てる(FIFO)
    if (logsRef.current.length >= MAX_LOGS) {
      logsRef.current.shift();
    }
    logsRef.current.push({ type: type, args: args });
    if (!flushScheduledRef.current) {
      flushScheduledRef.current = true;
      // requestAnimationFrame でフレームごとに反映 → 同期的に追加した複数ログが
      // 1フレーム後にまとめて反映される
      requestAnimationFrame(() => {
        flushScheduledRef.current = false;
        setLogs([].concat(logsRef.current));
      });
    }
  };

  const sandboxConsole = useRef({
    log: function() {
      pushLog("log", Array.prototype.slice.call(arguments));
    },
    error: function() {
      pushLog("error", Array.prototype.slice.call(arguments));
    },
    warn: function() {
      pushLog("warn", Array.prototype.slice.call(arguments));
    },
  }).current;

  useEffect(() => {
    const t = setTimeout(() => {
      try {
        // reset logs when code recompiles
        logsRef.current = [];
        setLogs([]);
        const C = compileUserCode(code, sandboxConsole, prelude);
        setComponent(() => C);
        setError(null);
        setRenderKey(k => k + 1);
      } catch (e) { setError(e.message); }
    }, 250);
    return () => clearTimeout(t);
  }, [code, prelude]);

  // Memoize the rendered component so Sandbox re-renders (from log updates)
  // don't re-trigger user's component (which would cause infinite log loops)
  const MemoComponent = React.useMemo(() => React.memo(Component), [Component]);

  const reset = () => setCode(initialCode);
  const clearLogs = () => { logsRef.current = []; setLogs([]); };

  return (
    <div className="card overflow-hidden my-4">
      <div className="flex items-center justify-between bg-orange-50 px-4 py-3 border-b-2 border-orange-100">
        <div className="flex items-center gap-2">
          <span className="w-3 h-3 rounded-full bg-orange-300"/>
          <span className="w-3 h-3 rounded-full bg-yellow-300"/>
          <span className="w-3 h-3 rounded-full bg-green-300"/>
          <span className="ml-2 text-xs font-bold text-orange-600">▶ ライブサンドボックス — 編集すると右側に反映するよ ✨</span>
        </div>
        <button onClick={reset} className="flex items-center gap-1 text-xs font-bold text-rose-500 hover:text-rose-600">
          <Reload /> リセット
        </button>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3">
        <div className="border-r-2 border-orange-100 md:col-span-2 min-w-0">
          <div className="text-[10px] text-orange-500 px-3 pt-2 font-bold tracking-widest">EDITOR</div>
          <textarea
            value={code}
            onChange={e => setCode(e.target.value)}
            spellCheck={false}
            wrap="off"
            className="code-edit"
            style={{ height: height + "px" }}
          />
        </div>
        <div className="bg-yellow-50 md:col-span-1 min-w-0">
          <div className="text-[10px] text-amber-600 px-3 pt-2 font-bold tracking-widest">PREVIEW 👀</div>
          <div className="p-3" style={{ minHeight: height + "px" }}>
            {error ? (
              <div className="text-xs text-rose-700 bg-orange-50 border-2 border-orange-200 rounded-2xl p-3 code-font whitespace-pre-wrap">
                ⚠ {error}
              </div>
            ) : (
              <ErrorBoundary key={renderKey}>
                <MemoComponent />
              </ErrorBoundary>
            )}
          </div>
        </div>
      </div>

      {/* CONSOLE pane */}
      <div className="bg-slate-900 border-t-2 border-orange-100">
        <div className="flex items-center justify-between px-3 pt-2">
          <div className="text-[10px] text-orange-300 font-bold tracking-widest">CONSOLE 🖥️ <span className="text-orange-200/60">{logs.length > 0 ? "(" + logs.length + " logs)" : ""}</span></div>
          {logs.length > 0 && (
            <button onClick={clearLogs} className="text-[10px] text-orange-300 hover:text-orange-100 underline">クリア</button>
          )}
        </div>
        <div className="px-3 py-2 overflow-y-auto code-font text-xs" style={{ maxHeight: "200px", minHeight: "60px" }}>
          {logs.length === 0 ? (
            <div className="text-slate-500 italic">(console.log() で出力するとここに出ます)</div>
          ) : (
            logs.map((entry, i) => (
              <div key={i} className={"py-1 border-b border-slate-800 " + (entry.type === "error" ? "text-rose-300" : entry.type === "warn" ? "text-amber-300" : "text-slate-200")}>
                <span className="text-slate-500 mr-2">›</span>
                {entry.args.map((a, j) => (
                  <span key={j} className="mr-2 whitespace-pre-wrap">{fmtConsoleArg(a)}</span>
                ))}
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

// ===========================
// CodeBlock (静的、コピー可)
// ===========================
function CodeBlock({ title, html }) {
  const [copied, setCopied] = useState(false);
  const ref = useRef(null);
  const onCopy = () => {
    if (!ref.current) return;
    navigator.clipboard.writeText(ref.current.innerText.trim());
    setCopied(true);
    setTimeout(() => setCopied(false), 1200);
  };
  return (
    <div className="my-4">
      {title && (
        <div className="flex items-center justify-between bg-white border-2 border-orange-200 border-b-0 rounded-t-2xl px-4 py-2">
          <span className="text-xs code-font text-orange-600 font-bold">{title}</span>
          <button onClick={onCopy} className="flex items-center gap-1 text-xs font-bold text-orange-500 hover:text-orange-700">
            {copied ? <><Check /> Copied!</> : <><Copy /> Copy</>}
          </button>
        </div>
      )}
      <pre ref={ref} className={"code-block " + (title ? "rounded-t-none" : "")} dangerouslySetInnerHTML={{ __html: html }} />
    </div>
  );
}

function PageTitle({ kicker, title, sub, emoji }) {

      </h1>
      {sub && <p className="mt-4 text-base md:text-lg text-gray-500 max-w-3xl mx-auto">{sub}</p>}
    </div>
  );
}

function PageNav({ navigate, prev, next }) {

  );
}

function HomeTulipTeaser({ navigate }) {

function JsxCompiler() {
  const [jsx, setJsx] = useState(`// 自作コンポーネント(大文字始まり)
function Tulip({ stage }) {
  return <span>{stage}</span>;
}

function App() {
  return (
    <div>
      <h1>こんにちは!</h1>
      <p>Reactへようこそ</p>
      <Tulip stage="🌷" />
    </div>
  );
}`);
  const [output, setOutput] = useState("");
  const [error, setError] = useState(null);
  useEffect(() => {
    try {
      const result = Babel.transform(jsx, { presets: ["react"] }).code;
      setOutput(result);
      setError(null);
    } catch (e) {
      setError(e.message);
    }
  }, [jsx]);
  return (
    <div className="card overflow-hidden my-4">
      <div className="bg-orange-50 px-4 py-3 border-b-2 border-orange-100 text-xs font-bold text-orange-600">
        ✨ JSX → JavaScript ライブ変換器
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2">
        <div className="border-r-2 border-orange-100">
          <div className="text-[10px] text-orange-500 px-3 pt-2 font-bold tracking-widest">📝 JSX (書く側)</div>
          <textarea
            value={jsx}
            onChange={e => setJsx(e.target.value)}
            spellCheck={false}
            className="code-edit"
            style={{ height: "260px" }}
          />
        </div>
        <div className="bg-emerald-50">
          <div className="text-[10px] text-emerald-700 px-3 pt-2 font-bold tracking-widest">⚙ JavaScript (実際に動く)</div>
          <pre className="code-edit" style={{ height: "260px", overflow: "auto", color: error ? "#b91c1c" : "#065f46", whiteSpace: "pre-wrap", padding: "16px", margin: 0, background: "transparent" }}>
            {error ? "⚠ " + error : output}
          </pre>
        </div>
      </div>
    </div>
  );
}

            <div className="bg-white border-2 border-amber-200 rounded-xl p-4 mb-3">

                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mt-2">

<span style={{color:"#dc2626"}}>&lt;a</span> <span style={{color:"#2563eb"}}>href="/about" className="link"</span><span style={{color:"#dc2626"}}>&gt;</span><span style={{color:"#16a34a"}}>About</span><span style={{color:"#dc2626"}}>&lt;/a&gt;</span></pre>

                    <li className="flex gap-2"><span className="text-amber-600 font-bold">▸</span><span><strong>type</strong>: タグ名(<code className="bg-amber-50 px-1 rounded">"h1"</code>, <code className="bg-amber-50 px-1 rounded">"div"</code>)、または<strong>自分で作ったコンポーネント</strong>(<code className="bg-amber-50 px-1 rounded">Tulip</code>)</span></li>
                    <li className="flex gap-2"><span className="text-amber-600 font-bold">▸</span><span><strong>props</strong>: <strong>HTMLでいう「属性」</strong>(<code className="bg-amber-50 px-1 rounded">class</code>, <code className="bg-amber-50 px-1 rounded">href</code>, <code className="bg-amber-50 px-1 rounded">onClick</code> など)を、まとめてオブジェクトの形で渡す。例: <code className="bg-amber-50 px-1 rounded">{`{ href: "/", className: "btn" }`}</code>。なければ <code className="bg-amber-50 px-1 rounded">null</code>。</span></li>

                    <CodeBlock title="" html={`<span class="keyword">for</span> (<span class="keyword">const</span> [key, value] <span class="keyword">of</span> Object.<span class="fn">entries</span>(element.<span class="keyword">props</span>)) {
  <span class="keyword">if</span> (key === <span class="string">"className"</span>) el.className = value;
  <span class="keyword">else if</span> (key === <span class="string">"style"</span>) Object.<span class="fn">assign</span>(el.style, value);
  <span class="keyword">else if</span> (key.<span class="fn">startsWith</span>(<span class="string">"on"</span>)) {
    <span class="comment">// onClick → click イベントリスナーとして登録</span>
    el.<span class="fn">addEventListener</span>(key.<span class="fn">slice</span>(<span class="num">2</span>).<span class="fn">toLowerCase</span>(), value);
  }
  <span class="keyword">else if</span> (key === <span class="string">"children"</span>) { <span class="comment">/* ③で処理 */</span> }
  <span class="keyword">else</span> el.<span class="fn">setAttribute</span>(key, value);
}`} />

                    <div className="mt-2 bg-white border border-emerald-200 rounded-lg p-3">

  <span class="keyword">id</span>: <span class="string">"hello"</span>,
  <span class="keyword">onClick</span>: handleClick,
  <span class="keyword">children</span>: <span class="string">"🌷 こんにちは"</span>
}`} />

el.<span class="fn">addEventListener</span>(<span class="string">"click"</span>, handleClick);     <span class="comment">// onClick → click イベント登録</span>
<span class="comment">// children は ③ で別処理(スキップ)</span>`} />

      <div className="card-pink p-6 mb-6">
        <h2 className="text-2xl font-extrabold text-orange-700 mb-3 flex items-center gap-2"><span>🌱</span>State(ステート)って何?</h2>

        <div className="bg-orange-50 border-2 border-orange-200 rounded-xl p-4 mb-4">
          <div className="text-xs font-bold text-orange-700 mb-1">📌 1行で言うと</div>

        <p className="text-sm text-gray-700 mb-3">
          例えば「今の水の回数」「ボタンを押した回数」「入力中の文字」「ログイン中かどうか」など、<strong>時間とともに変わる値</strong>はぜんぶ State。
        </p>

        <h3 className="font-extrabold text-orange-700 mt-4 mb-2">📝 useState で作る</h3>
        <p className="text-sm text-gray-700 mb-2">
          Reactでは <code className="bg-orange-50 px-1.5 rounded border border-orange-200">useState</code> という関数で State を作ります:
        </p>
        <CodeBlock title="" html={`<span class="keyword">const</span> [water, setWater] = <span class="fn">useState</span>(<span class="num">0</span>);`} />
        <div className="grid grid-cols-1 md:grid-cols-3 gap-2 mt-2 mb-3">
          <div className="bg-orange-50 border border-orange-200 rounded-lg p-2 text-xs">
            <div className="font-bold text-orange-700 mb-1"><code className="bg-white px-1 rounded">water</code></div>
            <div className="text-gray-700">👁 <strong>今の値</strong>(現在の state を読むときに使う)</div>
          </div>
          <div className="bg-orange-50 border border-orange-200 rounded-lg p-2 text-xs">
            <div className="font-bold text-orange-700 mb-1"><code className="bg-white px-1 rounded">setWater</code></div>
            <div className="text-gray-700">✏️ <strong>更新する関数</strong>(これを呼ぶと state が変わって再描画)</div>
          </div>
          <div className="bg-orange-50 border border-orange-200 rounded-lg p-2 text-xs">
            <div className="font-bold text-orange-700 mb-1"><code className="bg-white px-1 rounded">0</code></div>
            <div className="text-gray-700">🌱 <strong>初期値</strong>(初回レンダーで使われる開始値)</div>
          </div>
        </div>
        <p className="text-xs text-gray-500 mb-2">
          仕組み:<code className="bg-orange-50 px-1 rounded">useState(0)</code> は <code className="bg-orange-50 px-1 rounded">[現在値, 更新関数]</code> という配列を返す → それを <strong>分割代入</strong>で受け取っているだけ。
        </p>

        <h3 className="font-extrabold text-orange-700 mt-5 mb-2">🛠 使い方は2つだけ</h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
          <div className="bg-white border-2 border-orange-200 rounded-lg p-3">
            <div className="text-[11px] font-bold text-orange-700 mb-1">👁 読みたい時</div>

【React が内部でやっている処理】

        const btn = document.createElement('button');
        btn.textContent = '💧 水をあげる';

   ② その要素オブジェクトに、React 専用のプロパティを直接代入
        btn.__reactProps$xxxxx = {

          children: '💧 水をあげる',

        btn.__reactFiber$xxxxx = /* Fiberノードへの参照 */;

        rootEl.appendChild(btn);

   ┌────────────────────────────────────────┐

   │   style:       { ... }                  │
   │                                         │

   │   __reactProps$xxxxx = {                │
   │     onClick:  ƒ,    ← 関数オブジェクト  │
   │     children: "💧 水をあげる",          │
   │   }                                     │
   │   __reactFiber$xxxxx = { ... }          │
   └────────────────────────────────────────┘

   📝 メタファー: __reactProps$xxxxx は、React が <button> に

例: ブラウザのデフォルト動作を止めたい

function App() {
  const [path, navigate] = useHashRoute();
  const [notesOpen, setNotesOpen] = useState(false);

  // ←→キーで移動
  useEffect(() => {
    const handler = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
      const idx = ROUTES.indexOf(path);
      if (idx === -1) return;
      if (e.key === "ArrowRight" && idx < ROUTES.length - 1) navigate(ROUTES[idx + 1]);
      if (e.key === "ArrowLeft" && idx > 0) navigate(ROUTES[idx - 1]);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [path]);

  let Page;
  if (path === "/") Page = Home;
  else if (path === "/how") Page = How;
  else if (path === "/setup") Page = Setup;
  else if (path === "/try") Page = Try;
  else if (path === "/fin") Page = Fin;
  else Page = Home;

  return (
    <>
      <Layout navigate={navigate} current={path}>
        <Page navigate={navigate} />
      </Layout>
      <button
        onClick={() => setNotesOpen(!notesOpen)}
        title="台本を開く/閉じる"
        className="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-orange-500 hover:bg-orange-600 text-white text-2xl shadow-xl flex items-center justify-center transition-all"
        style={{ boxShadow: "0 6px 0 #c2410c, 0 12px 24px rgba(249,115,22,0.4)" }}
      >
        {notesOpen ? "✕" : "📝"}
      </button>
      <NotesPanel open={notesOpen} onClose={() => setNotesOpen(false)} path={path} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
